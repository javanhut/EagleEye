[package]
name = "eagleeye"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "EagleEye: a fast image viewer for Raven Linux. Every common format, animated GIF/WebP/APNG, SVG, HEIC/AVIF/JXL."

[[bin]]
name = "eagleeye"
path = "src/main.rs"

[dependencies]
# Same gtk-rs generation as RavenViewer, RavenStore and RavenSettingsUI so
# every Raven app resolves one set of bindings. v4_14 for Monitor::scale, the
# real (fractional) screen density that makes 100% mean one screen pixel.
gtk4 = { version = "0.10", features = ["v4_14"] }
libadwaita = { version = "0.8", features = ["v1_5"] }
glib = "0.21"
gio = "0.21"
# Decode and resample threads hand results to the GTK main loop over this.
async-channel = "2"

# Decoding is pure Rust on purpose, like RavenViewer: no C toolchain beyond
# GTK. image covers the raster formats, resvg draws SVG. Whatever neither
# knows (HEIC, AVIF, JXL…) falls through to GTK's own loaders (glycin).
image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm",
  "qoi", "hdr", "exr", "dds", "ff", "rayon",
] }
resvg = "0.48"
# Lanczos downscaling with SIMD, split across cores: the GPU's trilinear
# filter is visibly soft, and image's own resize is far too slow to redo on
# every zoom.
fast_image_resize = { version = "6", features = ["rayon"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[profile.dev]
debug = "line-tables-only"
# The resizer is generic, so its hot loops are compiled inside this crate,
# not the (always optimized) dependency. Unoptimized, a 6700×4467 downscale
# takes ~6 s instead of ~0.2 s. opt-level 1 fixes that and barely slows the
# rebuild.
opt-level = 1

# Decoders are unusably slow unoptimized, so dependencies are always -O.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
