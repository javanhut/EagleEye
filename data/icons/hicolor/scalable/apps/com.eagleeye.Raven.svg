  <g clip-path="url(#photo)">
    <rect x="26" y="30" width="76" height="60" fill="url(#sky)"/>
    <circle cx="84" cy="46" r="7" fill="#ffffff"/>
    <path d="M26 90V74l20-18 22 20 12-10 22 18v6z" fill="#5c6aa8"/>
    <path d="M26 90V80l18-10 30 20z" fill="#3d4780"/>
